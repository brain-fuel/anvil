<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e7490">
<link rel="manifest" href="/manifest.webmanifest">
<title>anvil — agenda</title>
<style>
:root{color-scheme:light dark;--accent:#0e7490;--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#101a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#1e293b}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:20px 14px 64px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:1.3rem;margin:.25rem 0}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.day{margin:1.4rem 0 .4rem;font-weight:650}
.day.today{color:var(--accent)}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.time{min-width:86px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;padding-top:2px}
.what{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-right:6px;color:var(--muted)}
.act a{display:inline-block;margin:4px 6px 0 0;padding:7px 12px;border-radius:8px;font-size:.85rem;font-weight:600;text-decoration:none;background:var(--accent);color:#fff}
.act a.dir{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.empty,.err{color:var(--muted);padding:1.5rem 0}
.err{color:#b91c1c}
.now{border-color:var(--accent)}
</style>
</head>
<body>
<main>
<header>
  <h1>⚒ anvil</h1>
  <select id="days">
    <option value="1">today</option>
    <option value="3">3 days</option>
    <option value="7" selected>week</option>
    <option value="14">2 weeks</option>
  </select>
</header>
<div id="list"><p class="empty">Loading…</p></div>
</main>
<script>
const list=document.getElementById('list'),daysSel=document.getElementById('days');
const fmtT=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dayKey=t=>new Date(t).toDateString();
async function load(){
  try{
    const r=await fetch('/api/agenda?days='+daysSel.value);
    if(!r.ok)throw new Error(r.status);
    const {items,errors}=await r.json();
    render(items,errors||[]);
  }catch(e){list.innerHTML='<p class="err">Could not load agenda: '+e+'</p>'}
}
function render(items,errors){
  const now=Date.now(),today=dayKey(now);
  let html=errors.map(e=>'<p class="err">'+esc(e)+'</p>').join('');
  if(!items.length)html+='<p class="empty">Nothing scheduled. Enjoy the quiet.</p>';
  let prev='';
  for(const it of items){
    const k=dayKey(it.start);
    if(k!==prev){
      prev=k;
      const d=new Date(it.start);
      html+='<div class="day'+(k===today?' today':'')+'">'+(k===today?'Today':d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}))+'</div>';
    }
    const live=now>=Date.parse(it.start)&&now<Date.parse(it.end);
    html+='<div class="item'+(live?' now':'')+'">'
      +'<div class="time">'+(it.allDay?'all day':fmtT(it.start)+'<br>'+fmtT(it.end))+'</div>'
      +'<div class="what"><div class="title">'+esc(it.summary||'(busy)')+'</div>'
      +'<div class="sub"><span class="tag">'+esc(it.calendar)+'</span>'+(it.location&&!it.joinUrl?esc(it.location):'')+'</div>'
      +'<div class="act">'
      +(it.joinUrl?'<a href="'+esc(it.joinUrl)+'" target="_blank" rel="noopener">Join</a>':'')
      +(it.mapsUrl?'<a class="dir" href="'+esc(it.mapsUrl)+'" target="_blank" rel="noopener">Directions</a>':'')
      +'</div></div></div>';
  }
  list.innerHTML=html;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
daysSel.addEventListener('change',load);
load();setInterval(load,5*60*1000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
