# anvil + Caddy (automatic HTTPS). Set DOMAIN and EMAIL, put anvil.json next
# to this file, then: docker compose up -d
services:
  anvil:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ./anvil.json:/etc/anvil/anvil.json:ro
      - anvil-data:/data
    healthcheck:
      test: ["CMD", "/anvil", "version"]
      interval: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your hostname}
      EMAIL: ${EMAIL:?set EMAIL for Let's Encrypt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  anvil-data:
  caddy-data:
